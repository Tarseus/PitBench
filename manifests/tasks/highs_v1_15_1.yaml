  solver_seeds: [0, 1, 2]
  threads: 1
  verifier: private://oracles/verifiers/mip_solution
  validation_build: {compiler: gcc, flags: [-O1, -g], sanitizers: [address, undefined]}
  performance_build: {compiler: gcc, flags: [-O3, -DNDEBUG]}
populations:
  - name: agent_dev
    kind: agent_dev
    manifest: manifests/populations/highs_v1_15_1_dev.yaml
    size: 5
    randomness: {instance_seed: 115100}
  - name: judge_id
    kind: judge_id
    manifest: private://hidden_instances/highs_v1_15_1/judge_id.yaml
    size: 30
    randomness: {instance_seed: 115110}
  - name: non_scheduling_mip
    kind: judge_shift
    manifest: private://hidden_instances/highs_v1_15_1/non_scheduling_mip.yaml
