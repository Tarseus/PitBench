schema_version: "2.0"
task_id: highs_v1_15_1
split: benchmark
release:
  repository: ERGO-Code/HiGHS
  version: "1.15.1"
  tag: v1.15.1
  base_commit: 04024d701f79feb8e2f18bc3df0dffc04ef05088
  released_at: 2026-07-02T11:25:02Z
  url: https://github.com/ERGO-Code/HiGHS/releases/tag/v1.15.1
task_type: exact_solver
problem_family: mip
optimization_scope: mip_search_efficiency
instruction: >-
  Improve exact-solver performance while preserving feasibility, certificates, and
  objective semantics. Use only the visible development instances.
information_regime: snapshot_only
repository:
  clone_url: https://github.com/ERGO-Code/HiGHS.git
  language: cpp
  plugin: pitbench.repositories.highs:HighsRepositoryPlugin
