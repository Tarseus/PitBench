name: Publish PyVRP judge image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/judge-images/pyvrp/**
      - .github/workflows/publish-judge-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build judge image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/judge-images/pyvrp/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pitbench-pyvrp-judge-smoke:${{ github.sha }}
          cache-from: type=gha,scope=pyvrp-judge
          cache-to: type=gha,mode=max,scope=pyvrp-judge

      - name: Verify evaluator execution path
        env:
          JUDGE_IMAGE: pitbench-pyvrp-judge-smoke:${{ github.sha }}
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=256m \
            --env PYTHONPATH=/opt/pitbench \
            --volume "$GITHUB_WORKSPACE:/opt/pitbench:ro" \
            "$JUDGE_IMAGE" \
            python -m pitbench.evaluator.runner --help
          docker run --rm --network none "$JUDGE_IMAGE" \
            sh -lc 'test ! -e /private/oracle.yaml && \
              python -c "import numpy, pandas, pyarrow, yaml" && \
              test "$(pkg-config --modversion spdlog)" = 1.17.0 && \
              git --version && gcc --version && cmake --version'

      - name: Publish verified judge image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/judge-images/pyvrp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tarseus/pitbench-pyvrp-judge:gcc13-python312
            ghcr.io/tarseus/pitbench-pyvrp-judge:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tarseus/PitBench
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=PitBench PyVRP evaluator environment
          cache-from: type=gha,scope=pyvrp-judge

      - name: Record immutable judge reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo '### Immutable PyVRP judge image' >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/tarseus/pitbench-pyvrp-judge@$DIGEST\`" \
            >> "$GITHUB_STEP_SUMMARY"
