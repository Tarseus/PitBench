name: Publish solver images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/solver-images/**
      - .github/workflows/publish-solver-images.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: pyvrp
            task_id: pyvrp_v0_12_2
            version: 0.12.2
            source_repository: https://github.com/PyVRP/PyVRP.git
            base_commit: ea0c4211819edac6fd920413ad7508cc9ad56e0e
          - solver: pyvrp
            task_id: pyvrp_v0_13_0
            version: 0.13.0
            source_repository: https://github.com/PyVRP/PyVRP.git
            base_commit: 542cdd32e4b10791e15b911cfbad0691538ed987
          - solver: pyvrp
            task_id: pyvrp_v0_13_4
            version: 0.13.4
            source_repository: https://github.com/PyVRP/PyVRP.git
            base_commit: 18815548d04a90a0e5eea2a0bed53a81ea9d2d49
          - solver: pyvrp
            task_id: pyvrp_v0_14_0
            version: 0.14.0
            source_repository: https://github.com/PyVRP/PyVRP.git
            base_commit: 5d9776a954b810bdb3fe71d47b1e7de7cffe90d2
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build prepared image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/solver-images/${{ matrix.solver }}/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            SOURCE_REPOSITORY=${{ matrix.source_repository }}
            BASE_COMMIT=${{ matrix.base_commit }}
          tags: pitbench-pyvrp-smoke:${{ matrix.base_commit }}
          cache-from: type=gha,scope=${{ matrix.solver }}-${{ matrix.base_commit }}
          cache-to: type=gha,mode=max,scope=${{ matrix.solver }}-${{ matrix.base_commit }}

      - uses: astral-sh/setup-uv@v6

      - name: Install PitBench
        run: uv sync --no-dev

      - name: Verify downloaded-image execution path
        env:
          BASE_IMAGE: pitbench-pyvrp-smoke:${{ matrix.base_commit }}
          SOURCE_CONTAINER: pitbench-source-${{ matrix.task_id }}
          SOURCE_PATH: ${{ runner.temp }}/source-${{ matrix.task_id }}
          TASK_PATH: ${{ runner.temp }}/task-${{ matrix.task_id }}
          THIN_IMAGE: pitbench-thin-smoke:${{ matrix.base_commit }}
        run: |
          docker create --name "$SOURCE_CONTAINER" "$BASE_IMAGE" true
          mkdir -p "$SOURCE_PATH"
          docker cp "$SOURCE_CONTAINER:/workspace/repo/." "$SOURCE_PATH"
          uv run pitbench tasks materialize "${{ matrix.task_id }}" \
            --output "$TASK_PATH" \
            --repository-source "$SOURCE_PATH" \
            --agent-image "$BASE_IMAGE" \
            --agent-tool inspect \
            --agent-tool bench
          docker build --tag "$THIN_IMAGE" "$TASK_PATH"
          docker run --rm --network none "$THIN_IMAGE" pitbench inspect
          docker run --rm --network none "$THIN_IMAGE" \
            pitbench bench --split dev --instance dev_0000 --seed 0 --budget 1

      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/solver-images/${{ matrix.solver }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REPOSITORY=${{ matrix.source_repository }}
            BASE_COMMIT=${{ matrix.base_commit }}
          tags: |
            ghcr.io/tarseus/pitbench-${{ matrix.solver }}:${{ matrix.version }}
            ghcr.io/tarseus/pitbench-${{ matrix.solver }}:${{ matrix.base_commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tarseus/PitBench
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ matrix.base_commit }}
          cache-from: type=gha,scope=${{ matrix.solver }}-${{ matrix.base_commit }}
