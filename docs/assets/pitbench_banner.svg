<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Mathematical Slate Background Gradient -->
    <linearGradient id="mathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E17"/>
    </linearGradient>

    <!-- Polytope Facet Gradients -->
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="facet3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="facet4" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Coordinate Grid Pattern -->
    <pattern id="mathGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.5"/>
      <circle cx="30" cy="30" r="0.75" fill="#334155" fill-opacity="0.6"/>
    </pattern>

    <!-- Subtle Blur for Depth of Field -->
    <filter id="mathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .math-title {
      font-family: "Latin Modern Roman", "Computer Modern Roman", "Times New Roman", "Baskerville", Georgia, serif;
      font-weight: 700;
      font-size: 68px;
      letter-spacing: 5px;
    }
    .math-sub {
      font-family: "Latin Modern Roman", "Times New Roman", Georgia, serif;
      font-style: italic;
      font-size: 21px;
      letter-spacing: 1px;
    }
    .formula-watermark {
      font-family: "Cambria Math", "Latin Modern Math", "TeX Gyre Termes Math", "Times New Roman", serif;
      font-style: italic;
      fill: #334155;
      opacity: 0.35;
      user-select: none;
    }
    .latex-code {
      font-family: ui-monospace, SFMono-Regular, "Courier New", monospace;
      font-size: 13px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .axis-label {
      font-family: "Times New Roman", serif;
      font-style: italic;
      font-size: 12px;
      fill: #64748B;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="12" fill="url(#mathBg)"/>

  <!-- Mathematical Coordinate Grid -->
  <rect width="1200" height="360" rx="12" fill="url(#mathGrid)"/>

  <!-- ==================== BACKGROUND MATHEMATICAL FORMULAS (WATERMARKS) ==================== -->
  <g class="formula-watermark">
    <!-- Objective & Polytope Formulation -->
    <text x="350" y="70" font-size="20">min  c^T x   subject to   A x ≥ b,  x ∈ {0, 1}^n</text>
    <text x="750" y="65" font-size="19">∑_{e ∈ δ(S)} x_e ≥ 2,  ∀ S ⊂ V, S ≠ ∅</text>
    <text x="820" y="325" font-size="18">CI_{95%} = Bootstrap_instances(Δgap)</text>
    <text x="360" y="330" font-size="17">Δgap = (z_{base} - z_{agent}) / z_{BKS}  [CI_{95%}]</text>
    <text x="960" y="190" font-size="22">x(V) = |V| - k(V)</text>
  </g>

  <!-- Elegant Blueprint Border -->
  <rect width="1180" height="340" x="10" y="10" rx="8" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
  <rect width="1172" height="332" x="14" y="14" rx="6" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="8,6"/>

  <!-- ==================== LEFT: MATHEMATICAL POLYTOPE & GRAPH THEORY ==================== -->
  <g transform="translate(170, 180)">
    <!-- Coordinate Axes -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="125" y="4" class="axis-label">x₁</text>
    <text x="-4" y="-126" class="axis-label">x₂</text>

    <!-- Cutting Plane / Hyperplane (Branch & Cut) -->
    <line x1="-110" y1="65" x2="100" y2="-90" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.8"/>
    <text x="80" y="-98" font-family="Times New Roman" font-style="italic" font-size="11" fill="#F59E0B">a^T x = β (Cut)</text>

    <!-- 3D Convex Polyhedron (Feasible Region Ω) -->
    <!-- Polytope Facets -->
    <polygon points="0,-75 65,-25 50,55 -35,70 -75,0" fill="url(#facet1)" stroke="#38BDF8" stroke-width="1.8"/>
    <polygon points="0,-75 65,-25 20,10 -30,-15" fill="url(#facet2)" stroke="#818CF8" stroke-width="1.2"/>
    <polygon points="65,-25 50,55 5,30 20,10" fill="url(#facet3)" stroke="#34D399" stroke-width="1.2"/>
    <polygon points="50,55 -35,70 -10,15 5,30" fill="url(#facet4)" stroke="#F59E0B" stroke-width="1.2"/>
    <polygon points="-35,70 -75,0 -30,-15 -10,15" fill="url(#facet1)" stroke="#60A5FA" stroke-width="1.2"/>
    <polygon points="-75,0 0,-75 -30,-15" fill="url(#facet2)" stroke="#A78BFA" stroke-width="1.2"/>

    <!-- Interior Hamiltonian / TSP Tour (Solid Gold Path) -->
    <path d="M 0 -75 L 65 -25 L 50 55 L -35 70 L -75 0 Z" fill="none" stroke="#FBBF24" stroke-width="2.2" filter="url(#mathGlow)"/>

    <!-- Extreme Points / Vertices (V) -->
    <circle cx="0" cy="-75" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <circle cx="65" cy="-25" r="4.5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="50" cy="55" r="4.5" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <circle cx="-35" cy="70" r="4.5" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <circle cx="-75" cy="0" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>

    <!-- Optimal Solution Vector x* (Vertex with Anchor Ring) -->
    <circle cx="0" cy="-75" r="9" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="8" y="-80" font-family="Times New Roman" font-style="italic" font-size="14" font-weight="bold" fill="#38BDF8">x* (Optimum)</text>

    <!-- Gradient / Objective Vector c -->
    <line x1="0" y1="-75" x2="-40" y2="-115" stroke="#EC4899" stroke-width="1.8"/>
    <polygon points="-40,-115 -32,-111 -37,-106" fill="#EC4899"/>
    <text x="-56" y="-120" font-family="Times New Roman" font-style="italic" font-size="13" font-weight="bold" fill="#EC4899">-∇c</text>
  </g>

  <!-- ==================== RIGHT: ACADEMIC MATHEMATICAL TYPOGRAPHY ==================== -->
  <g transform="translate(370, 0)">
    <!-- Domain Header Notation -->
    <g transform="translate(0, 58)">
      <text x="0" y="0" class="latex-code">
        <tspan fill="#38BDF8">∀ x ∈ 𝒳_CO</tspan> :  <tspan fill="#94A3B8">Performance-First CO Solver Benchmark</tspan>
      </text>
      <line x1="0" y1="10" x2="740" y2="10" stroke="#334155" stroke-width="0.8"/>
    </g>

    <!-- Main Title (Serif / Academic Clean) -->
    <text x="0" y="142" fill="url(#goldText)" class="math-title">PITBENCH</text>

    <!-- Subtitle (Mathematical & Rigorous) -->
    <text x="2" y="180" fill="#93C5FD" class="math-sub">
      Evaluating Coding Agents on Production-Grade CO Solver Repositories
    </text>

    <!-- Abstract / Core Concept Line -->
    <text x="2" y="218" font-family="Georgia, serif" font-size="15" fill="#94A3B8">
      A performance-first benchmark anchored by Best-Known-Solutions (BKS),
    </text>
    <text x="2" y="240" font-family="Georgia, serif" font-size="15" fill="#94A3B8">
      paired multi-seed bootstrap confidence intervals, and held-out distribution shifts.
    </text>

    <!-- Solver Formula Taxonomy Bar -->
    <g transform="translate(0, 276)">
      <rect x="0" y="0" width="125" height="26" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="62.5" y="17" font-family="ui-monospace, monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">PyVRP v0.12.2</text>

      <rect x="135" y="0" width="125" height="26" rx="4" fill="#0F172A" stroke="#818CF8" stroke-width="0.8"/>
      <text x="197.5" y="17" font-family="ui-monospace, monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">PyVRP v0.13.0</text>

      <rect x="270" y="0" width="125" height="26" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="0.8"/>
      <text x="332.5" y="17" font-family="ui-monospace, monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">PyVRP v0.13.4</text>

      <rect x="405" y="0" width="125" height="26" rx="4" fill="#0F172A" stroke="#F472B6" stroke-width="0.8"/>
      <text x="467.5" y="17" font-family="ui-monospace, monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">PyVRP v0.14.0</text>
    </g>
  </g>
</svg>
