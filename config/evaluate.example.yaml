# Copy this file to config/evaluate.local.yaml and edit it for one machine.
# The local file is ignored by Git. Relative paths are resolved from the
# PitBench repository root. Null proxy values mean direct network access.
# `pitbench auth login codex` / `pitbench auth login agy` can create or update
# the machine-local file and connect existing native logins automatically.

paths:
  output_path: gushengda/experiments/ad-hoc/runs
  workspace_path: gushengda/experiments/ad-hoc/workspaces
  private_root: private
  base_cache_path: .pitbench/cache/base

# Configuration Robustness is launched automatically after the candidate run.
configuration_robustness:
  enabled: true
  experiment_config: configs/experiments/configuration_robustness.yaml
  output_path: configuration-robustness
  cpus: null
  search_seed: 20260918

# Evaluation execution options (null uses system auto-detection, e.g. nproc - 2)
# judge_parallel_runs: 10
# judge_cpus: 10.0
# Reusing measured BASE observations is opt-in; it can create cross-run noise.
# base_cache: true

# Development instances and inspection/benchmark commands are enabled by default.
# Set [] explicitly for a repository-only condition; add validate when desired.
agent_tools: [inspect, workspace, bench]
# For a matched feedback experiment, keep all other settings identical and
# switch only between outcome_only and solver_behavior.
agent_feedback_mode: solver_behavior

# Resource profiles live in configs/research/budgets.json.
# Standard 4h, Lite 1h, Research 8h; all use 8 vCPU and 32 GiB.
# Smoke retains a 300s wall time and inherits the selected resource profile.
# Explicit track selection takes precedence over all per-task budget overrides.
# research_track: standard
# For a preregistered custom resource group, omit research_track and set:
# research_budget:
#   track: standard
#   wall_time_sec: 14400
#   cpus: 8
#   memory_gib: 32
#   development_parallel_runs: 4  # scheduling preference, not a hard quota
#   checkpoints_sec: [1800, 3600, 7200, 14400]
# CPU/memory are the accepted initial profile, subject to pilot calibration.
# Total CPU and model costs are recorded; there is no default cumulative CPU cap.
# Trusted experiment CPU attribution is incomplete and stays explicitly missing.
# Use --n-attempts 3 for the recommended independent formal-attempt count.

tasks:
  pyvrp_v0_14_0:
    agent_image: ghcr.io/tarseus/pitbench-pyvrp@sha256:776623be0e47b5f907efc3855886b6cd635b6c09c17f2b8fd4c0597f2f74f445
    judge_image: ghcr.io/tarseus/pitbench-pyvrp-judge@sha256:c7a4f9abecc90cfcc5e4368ba46a9f35d5f7be2883ac53cff49e7f365f1c79a3

agents:
  codex:
    codex_binary: codex
    codex_auth_path: ~/.codex/auth.json
    # Native Codex tools run in the solver container. A credential-free frontend
    # sidecar is its only network peer and bridges to a budgeted host OAuth relay.
    # Use container for --remote-build or as the MCP compatibility fallback.
    runner_backend: workspace
    container_runner_image: python:3.13-slim-bookworm
    profile_path: null
    proxy_url: null
    relay_max_requests: 256
    # No token cap by default. Set a positive value only for an intentional
    # hard per-trial relay budget.
    relay_max_total_tokens: null
    relay_max_concurrent_requests: 1
    relay_max_duration_sec: null
  antigravity:
    agy_binary: agy
    # The isolated runner reads this agy JSON credential, not the host OS keyring.
    # `pitbench auth login agy` can export the existing Linux keyring credential
    # into .pitbench/credentials/ and configure its absolute path automatically.
    auth_token_path: ~/.gemini/antigravity-cli/antigravity-oauth-token
    settings_path: ~/.gemini/antigravity-cli/settings.json
    runner_backend: container
    container_runner_image: python:3.13-slim-bookworm
    profile_path: null
    proxy_url: null
    # Research tracks count quota waits inside their host wall deadline.
    # These retry settings do not grant extra research time.
    quota_retries: 1
    quota_max_wait_sec: 7200
    quota_retry_buffer_sec: 5
