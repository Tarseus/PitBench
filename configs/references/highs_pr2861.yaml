evaluation_note: >-
  The PR changes enumeration-presolve row scoring and overlap suppression.
  A public knapsack MIP activated the new scoring path 7,963 times and removed
  5,502 overlapping rows in the validation build. Three small models had
  independently enumerated optima; across 46 frozen base/PR observations,
  reported bounds and solve statuses had zero discrepancies with trusted
  optima. The hidden baseline solved 13 of 30 instances within the fixed
  20-second budget and timed out normally on 17. No hidden human-PR gain is
  claimed; this is an exact-solver open optimization opportunity.
