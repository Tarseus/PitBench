schema_version: "1.0"
visibility: agent
description: >-
  CVRP distribution and scale examples for inspecting generated data.
  These conditions do not freeze a benchmark split, a BKS, or an optimum.
generator:
  kind: euclidean_cvrp
  count: 3
  capacity: 50
  depot_mode: center
  distance_metric: EUC_2D
  randomness:
    coordinate_seed: 20261025
    demand_seed: 20262025
axes:
  spatial:
    uniform:
      coordinate_distribution: uniform
    clustered:
      coordinate_distribution: clustered
      cluster_count: 4
      cluster_spread: 6.0
    mixed:
      coordinate_distribution: mixed
      cluster_count: 4
      cluster_spread: 6.0
      uniform_fraction: 0.5
  demand:
    uniform:
      demand_distribution: uniform_integer
      demand_parameters: {low: 1, high: 10}
    bimodal:
      demand_distribution: bimodal
      demand_parameters:
        low: [1, 3]
        high: [8, 10]
        high_probability: 0.5
    depot_correlated:
      demand_distribution: depot_correlated
      demand_parameters: {low: 1, high: 10}
  scale:
    n50: {customers: [50]}
    n100: {customers: [100]}
    n200: {customers: [200]}
    n400: {customers: [400]}
    n800: {customers: [800]}
