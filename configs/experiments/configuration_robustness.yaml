# Approved M2 panel. Paths are relative to the PitBench repository root.
searcher_version: "2.4.0"
max_configurations: 16
instance_count: 10
solver_seed_count: 30
watchdog_grace_sec: 60
panels:
  - task_config: configs/tasks/pyvrp_v0_14_0.yaml
    collector: pyvrp
    feedback: normalized_gap
    instance_source: configs/instance_sets/pyvrp_cvrp_v1_dev.yaml
    seed_source: configs/tasks/pyvrp_v0_14_0.yaml
    seed_key: evaluation.seed_robustness.development_seeds
    seed_max: 4294967295
    parameters:
      neighbourhood.num_neighbours: {type: integer, bounds: [50, 60], default: 50}
      ils.history_length: {type: integer, bounds: [300, 500], default: 300}
      penalty.penalty_increase: {type: real, bounds: [1.25, 1.50], default: 1.50}
      penalty.penalty_decrease: {type: real, bounds: [0.85, 0.95], default: 0.90}
  - task_config: configs/tasks/highs_v1_15_1.yaml
    collector: highs
    feedback: capped_optimal_time
    instance_source: private/highs_nuisance/20260909/experiment.json
    instance_path_template: "models/{name}/original.npz"
    seed_source: private/highs_nuisance/20260909/experiment.json
    seed_key: solver_seeds
    seed_max: 2147483647
    fixed_options:
      parallel: "off"
      mip_feasibility_tolerance: 0.000001
      mip_rel_gap: 0.0001
      mip_abs_gap: 0.000001
    parameters:
      presolve: {type: categorical, choices: [choose, "off"], default: choose}
      mip_detect_symmetry: {type: categorical, choices: [true, false], default: true}
      mip_heuristic_run_feasibility_jump: {type: categorical, choices: [true, false], default: true}
      mip_heuristic_effort: {type: real, bounds: [0, 1], default: 0.05}
  - task_config: configs/tasks/choco_v6_0_1.yaml
    collector: choco
    instance_count: 5
    solver_seed_count: 30
    feedback: capped_optimal_time
    instance_source: configs/instance_sets/choco_v6_0_1_dev.yaml
    seed_source: configs/tasks/choco_v6_0_1.yaml
    seed_key: evaluation.seed_robustness.development_seeds
    seed_max: 9223372036854775807
    parameters:
      search_strategy:
        type: categorical
        choices: [input_order_lb, min_dom_lb, dom_over_wdeg, activity_based]
        default: input_order_lb
  - task_config: configs/tasks/ortools_cp_sat_solve_v9_15.yaml
    collector: ortools_cp_sat
    instance_count: 5
    solver_seed_count: 30
    feedback: capped_optimal_time
    instance_source: configs/instance_sets/ortools_cp_sat_solve_v9_15_dev.yaml
    seed_source: configs/tasks/ortools_cp_sat_solve_v9_15.yaml
    seed_key: evaluation.seed_robustness.development_seeds
    seed_max: 2147483647
    parameters:
      cp_model_presolve: {type: categorical, choices: [true, false], default: true}
      cp_model_probing_level: {type: integer, bounds: [0, 2], default: 2}
      linearization_level: {type: integer, bounds: [0, 2], default: 1}
      symmetry_level: {type: integer, bounds: [0, 4], default: 2}
      search_branching:
        type: categorical
        choices: [automatic_search, lp_search, pseudo_cost_search, portfolio_search]
        default: automatic_search
  - task_config: configs/tasks/vroom_v1_15_0.yaml
    collector: vroom
    instance_count: 10
    solver_seed_count: 1
    feedback: normalized_gap
    instance_source: configs/instance_sets/vroom_v1_15_0_dev.yaml
    seed_source: configs/tasks/vroom_v1_15_0.yaml
    seed_key: evaluation.solver_seeds
    seed_max: 0
    parameters:
      exploration_level: {type: integer, bounds: [0, 5], default: 5}
