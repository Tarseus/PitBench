schema_version: '1.0'
design_id: generalization_difficulty_v2
status: predeclared_before_new_measurement
scope: Controlled generated structure and scale populations. Public competition inventories
  supply external reference layers. Existing data and historical scores are preserved.
roles:
  protocol_calibration:
    visibility: judge
    count: 10
    seed_namespace: 2026110101
  diverse_development_v2:
    visibility: agent
    count: 5
    seed_namespace: 2026110102
  unseen_id:
    visibility: judge
    count: 30
    seed_namespace: 2026110103
  unseen_scale:
    visibility: judge
    count: 30
    seed_namespace: 2026110104
  unseen_structure:
    visibility: judge
    count: 30
    seed_namespace: 2026110105
  unseen_joint:
    visibility: judge
    count: 30
    seed_namespace: 2026110106
families:
  knapsack_independent:
    problem_family: mip
    generator:
      kind: multidimensional_knapsack_mps
      items:
      - 60
      dimensions:
      - 3
      weight_max: 100
      capacity_mode: ratio
      capacity_ratio: 0.5
      profit_mode: independent
      profit_max: 100
      randomness:
        instance_seed: 0
  covering_random:
    problem_family: mip
    generator:
      kind: random_set_covering_mip
      variables:
      - 60
      rows:
      - 40
      row_density: 0.1
      cost_max: 100
      randomness:
        instance_seed: 0
  independent_set:
    problem_family: mip
    generator:
      kind: independent_set_mip
      vertices:
      - 60
      edge_probability: 0.1
      weight_max: 20
      randomness:
        instance_seed: 0
  facility_location:
    problem_family: mip
    generator:
      kind: facility_location_mip
      facilities:
      - 6
      customers:
      - 12
      capacity_ratio: 1.5
      randomness:
        instance_seed: 0
  fixed_charge_flow:
    problem_family: mip
    generator:
      kind: fixed_charge_flow_mip
      nodes:
      - 16
      arc_density: 0.2
      flow_demand: 40
      randomness:
        instance_seed: 0
  cvrp_uniform:
    problem_family: cvrp
    generator:
      kind: euclidean_cvrp
      customers:
      - 250
      capacity: 50
      distance_metric: EUC_2D
      coordinate_distribution: uniform
      depot_mode: center
      demand_distribution: uniform_integer
      randomness:
        coordinate_seed: 0
        demand_seed: 1
  cvrp_clustered:
    problem_family: cvrp
    generator:
      kind: euclidean_cvrp
      customers:
      - 250
      capacity: 50
      distance_metric: EUC_2D
      coordinate_distribution: clustered
      cluster_count: 8
      cluster_spread: 4
      depot_mode: center
      demand_distribution: uniform_integer
      randomness:
        coordinate_seed: 0
        demand_seed: 1
  vrptw:
    problem_family: cvrp
    generator:
      kind: euclidean_cvrp
      customers: &id001
      - 250
      capacity: 50
      distance_metric: EUC_2D
      coordinate_distribution: mixed
      cluster_count: 8
      cluster_spread: 4
      uniform_fraction: 0.5
      depot_mode: center
      demand_distribution: uniform_integer
      time_window_slack: 100
      service_time: 5
      randomness: &id002
        coordinate_seed: 0
        demand_seed: 1
  cvrp_mixed:
    problem_family: cvrp
    generator:
      kind: euclidean_cvrp
      customers: *id001
      capacity: 50
      distance_metric: EUC_2D
      coordinate_distribution: mixed
      cluster_count: 8
      cluster_spread: 4
      uniform_fraction: 0.5
      depot_mode: center
      demand_distribution: uniform_integer
      randomness: *id002
