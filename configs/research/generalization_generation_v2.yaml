  discovery_replicates:
  - 0
  - 1
  - 2
  - 3
  - 4
  qualification_replicates:
  - 5
  - 6
  - 7
  - 8
  - 9
audit:
  development_role: diverse_development_v2
  include_original_development_tasks:
  - configs/tasks/release_cbc_v2_10_12.yaml
  - configs/tasks/release_scip_v10_0_3.yaml
  - configs/tasks/release_pyvrp_v0_13_4.yaml
  minimum_scale_extrapolation_ratio: 2
  scale_feature_by_problem_family:
    mip: variables
    cvrp: customers
  calibration_only_for_budget_selection: true
  hidden_results_must_not_select_budget: true
difficulty_design:
  description: Continuous empirical solve-time, verified target-hit and gap trajectories,
    stratified by problem structure and scale. Hardness is measured, not inferred
    from instance names.
  budget_probe_seconds:
  - 0.1
  - 1
  - 5
  - 20
  - 60
  reference_extension_seconds:
  - 300
  solver_seeds:
  - 0
  - 1
  tiers:
  - regression
  - short
  - medium
  - long
  - censored
  native_metrics: Keep exact solved coverage/PAR2 separate from feasible-reference
    routing gap. Unknown optima remain BKS and cannot establish exact solved coverage.
controlled_structure_note: Mixed CVRP shares all spatial/demand/capacity generator
  settings with VRPTW except the temporal constraints. It is included in diverse development
  before unseen VRPTW tests.
difficulty_adaptation_note: Small routing levels added after calibration showed that
  250-4000 customer panels concentrated in long/censored quality-target regimes. Existing
  2210 input hashes and all held-out scale levels are retained. No Agent outcomes
  were observed.
